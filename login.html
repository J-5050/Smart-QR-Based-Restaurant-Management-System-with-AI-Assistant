<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Smart QR Restaurant</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <i class="fas fa-user-circle"></i> Smart QR Restaurant
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="kitchen-dashboard.html">Kitchen</a></li>
                <li><a href="analytics.html">Analytics</a></li>
                <li><a class="active" href="login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="container auth-page">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Login to access your table, view orders, and enjoy personalized recommendations.</p>

            <div class="auth-toggle">
                <button id="loginTab" class="active" onclick="showAuthSection('login')">Login</button>
                <button id="registerTab" onclick="showAuthSection('register')">Register</button>
            </div>

            <div id="authMessage" class="auth-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required>
                </div>
                <button type="button" class="btn btn-primary btn-full" onclick="submitLogin()">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <form id="registerForm" style="display:none;">
                <div class="form-group">
                    <label for="registerName">Name</label>
                    <input type="text" id="registerName" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="Create password" required>
                </div>
                <button type="button" class="btn btn-secondary btn-full" onclick="submitRegister()">
                    <i class="fas fa-user-plus"></i> Register
                </button>
            </form>

            <div class="auth-footer">
                <p>After login, you can access the menu directly and place orders securely.</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Smart QR Restaurant. Enjoy your meal!</p>
    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
